<div class="w-64 bg-white border-r border-gray-200 h-full flex flex-col">
    <!-- Header -->
    <div class="p-6 border-b border-gray-200">
        <h1 class="text-xl font-bold text-gray-900">
            <a routerLink="/home" class="hover:text-blue-600 transition-colors">📚 MF Library</a>
        </h1>
    </div>

    <!-- User Welcome Section -->
    @if (isAuthenticated) {
    <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
        <p class="text-sm text-gray-600">Welcome back,</p>
        <p class="font-medium text-gray-900 truncate">{{ username }}</p>
    </div>
    }

    <!-- Navigation Menu -->
    <nav class="flex-1 p-4 space-y-2">
        <a routerLink="/home" routerLinkActive="bg-blue-50 text-blue-600 border-blue-200"
            class="flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200 border border-transparent">
            <span class="material-icons text-xl">home</span>
            <span class="font-medium">Home</span>
        </a>

        <a routerLink="/browse" routerLinkActive="bg-blue-50 text-blue-600 border-blue-200"
            class="flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200 border border-transparent">
            <span class="material-icons text-xl">search</span>
            <span class="font-medium">Browse Books</span>
        </a>

        <a routerLink="/my-books" routerLinkActive="bg-blue-50 text-blue-600 border-blue-200"
            class="flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200 border border-transparent">
            <span class="material-icons text-xl">bookmark</span>
            <span class="font-medium">My Books</span>
        </a>

        @if (isAuthenticated) {
        <a routerLink="/profile" routerLinkActive="bg-blue-50 text-blue-600 border-blue-200"
            class="flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200 border border-transparent">
            <span class="material-icons text-xl">person</span>
            <span class="font-medium">Profile</span>
        </a>
        }
    </nav>

    <!-- Auth Section -->
    <div class="p-4 border-t border-gray-200 bg-gray-50">
        @if (!isAuthenticated) {
        <div class="space-y-2">
            <button type="button" (click)="login()"
                class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg transition-colors duration-200 font-medium">
                <span class="material-icons text-xl">login</span>
                Sign In
            </button>
            <button type="button" routerLink="/signup"
                class="w-full flex items-center justify-center gap-2 border border-gray-300 hover:border-gray-400 text-gray-700 hover:text-gray-900 py-2 px-4 rounded-lg transition-all duration-200">
                <span class="material-icons text-xl">person_add</span>
                Sign Up
            </button>
        </div>
        } @else {
        <button type="button" (click)="logout()"
            class="w-full flex items-center justify-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 hover:text-red-700 py-2 px-4 rounded-lg transition-all duration-200 border border-red-200 font-medium">
            <span class="material-icons text-xl">logout</span>
            Sign Out
        </button>
        }
    </div>
</div>

<div class="w-64 bg-white surface-0 border-right-1 surface-border h-full flex flex-column">
    <!-- Header -->
    <div class="p-6 border-bottom-1 surface-border">
        <h1 class="text-xl font-bold text-900 m-0">
            <a routerLink="/home" class="no-underline text-900 hover:text-primary transition-colors transition-duration-200">
                <i class="pi pi-book text-xl mr-2"></i>
                MF Library
            </a>
        </h1>
    </div>

    <!-- User Welcome Section -->
    @if (isAuthenticated) {
    <div class="px-6 py-4 bg-gray-50 surface-100 border-bottom-1 surface-border">
        <p class="text-sm text-600 mb-1">Welcome back,</p>
        <p class="font-medium text-900 truncate m-0">{{ username }}</p>
    </div>
    }

    <!-- Navigation Menu -->
    <nav class="flex-1 p-4 flex flex-column gap-2">
        <a routerLink="/home" routerLinkActive="bg-blue-50 surface-100 text-primary border-primary"
            class="flex align-items-center gap-3 p-3 border-round-lg text-700 hover:surface-100 hover:text-900 transition-all transition-duration-200 border-1 border-transparent no-underline">
            <i class="pi pi-home text-xl"></i>
            <span class="font-medium">Home</span>
        </a>

        <a routerLink="/browse" routerLinkActive="bg-blue-50 surface-100 text-primary border-primary"
            class="flex align-items-center gap-3 p-3 border-round-lg text-700 hover:surface-100 hover:text-900 transition-all transition-duration-200 border-1 border-transparent no-underline">
            <i class="pi pi-search text-xl"></i>
            <span class="font-medium">Browse Books</span>
        </a>

        <a routerLink="/my-books" routerLinkActive="bg-blue-50 surface-100 text-primary border-primary"
            class="flex align-items-center gap-3 p-3 border-round-lg text-700 hover:surface-100 hover:text-900 transition-all transition-duration-200 border-1 border-transparent no-underline">
            <i class="pi pi-bookmark text-xl"></i>
            <span class="font-medium">My Books</span>
        </a>

        @if (isAuthenticated) {
        <a routerLink="/profile" routerLinkActive="bg-blue-50 surface-100 text-primary border-primary"
            class="flex align-items-center gap-3 p-3 border-round-lg text-700 hover:surface-100 hover:text-900 transition-all transition-duration-200 border-1 border-transparent no-underline">
            <i class="pi pi-user text-xl"></i>
            <span class="font-medium">Profile</span>
        </a>
        }
    </nav>

    <!-- Auth Section -->
    <div class="p-4 border-top-1 surface-border surface-100">
        @if (!isAuthenticated) {
        <div class="flex flex-column gap-2">
            <p-button 
                (onClick)="login()" 
                label="Sign In" 
                icon="pi pi-sign-in" 
                styleClass="w-full"
                severity="primary">
            </p-button>
            
            <p-button 
                routerLink="/signup"
                label="Sign Up" 
                icon="pi pi-user-plus" 
                styleClass="w-full"
                severity="secondary"
                outlined="true">
            </p-button>
        </div>
        } @else {
        <p-button 
            (onClick)="logout()" 
            label="Sign Out" 
            icon="pi pi-sign-out" 
            styleClass="w-full"
            severity="danger"
            outlined="true">
        </p-button>
        }
    </div>
</div>

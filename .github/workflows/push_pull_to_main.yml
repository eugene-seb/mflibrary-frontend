# Execute only if it's a PR which comes from dev
name: PR to main (Angular)

on:
  push:
    branches:
      - main  # No push to main allowed, but I need to listen this event, so I can reject it
  pull_request:
    branches:
      - main  # Only allow PRs from dev -> main

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if source is dev
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "❌ Direct push to main is not allowed!"
            exit 1
          elif [[ "${{ github.head_ref }}" != "dev" ]]; then
            echo "❌ PRs to main must come from dev!"
            exit 1
          elif [[ "${{ github.head_ref }}" == "dev" ]]; then
            echo "✅ PRs to main authorized."
            exit 0
          fi

  build-and-test:
    runs-on: ubuntu-latest
    needs: validate-branch
    if: success()

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

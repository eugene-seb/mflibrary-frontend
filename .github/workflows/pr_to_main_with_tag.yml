# Publish the app with the new Tag on main
# Execute only if it's a PR which comes from dev with a TAG
name: PR to main with a TAG (Angular)

on:
  push:
    branches:
      - main  # No push to main allowed, but I need to listen this event, so I can reject it
  pull_request_target:
    branches:
      - main # I allow only PR from dev -> main

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if source is dev
        run: |
      - name: Check if source is dev and tag is present
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "❌ Direct push to main is not allowed!"
            exit 1
          elif [[ "${{ github.head_ref }}" != "dev" ]]; then
            echo "❌ PRs to main must come from dev!"
            exit 1
          elif [[ -z "${{ github.event.pull_request.head.ref }}" || "${{ github.event.pull_request.head.ref }}" != "dev" ]]; then
            echo "❌ PRs to main must come from dev!"
            exit 1
          elif [[ -z "${{ github.event.pull_request.head.label }}" || ! "${{ github.event.pull_request.head.label }}" =~ ^v[0-9]+$ ]]; then
            echo "❌ PR must include a valid tag (e.g., v1, v2)!"
            exit 1
          else
            echo "✅ PRs to main authorized with a valid tag."
            exit 0
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: validate-branch
    if: success()

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build -- --configuration=production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Extract Git Tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}:latest
          file: ./Dockerfile
